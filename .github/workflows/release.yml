name: Release

on:
  push:
    tags:
      # Two-dot shape: matches v2.0.0 and v2.0.0-beta.1; excludes the bare
      # major tag (v2) so moving it does not re-trigger this workflow.
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ccswe-apps/actions/.github/workflows/npm-release-action.yml@master
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
