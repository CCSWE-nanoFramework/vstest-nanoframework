name: Continuous Integration

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Check Node Version Files
        id: node-version-files
        run: cmp .node-version .nvmrc

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup nanoFramework
        uses: CCSWE-nanoFramework/actions-nanoframework/.github/actions/setup-nanoframework@master

      - name: Build solution
        uses: CCSWE-nanoFramework/actions-nanoframework/.github/actions/build-nanoframework@master
        with:
          solution: solution/VsTestAction.sln

      # Defaults otherwise: NFUnitTest1 uses its own nano.runsettings and
      # NFUnitTest2 falls back to the package template, so two groups run.
      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          working-directory: solution
          artifact-name: vstest-results-default
          artifact-retention-days: 1

      - name: Check results
        shell: bash
        env:
          RESULTS: ${{ steps.test-action.outputs.results-directory }}
        run: |
          count="$(find "$RESULTS" -name '*.trx' | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::Expected 2 TRX files in $RESULTS, found $count"
            exit 1
          fi

  test-action-failure:
    name: GitHub Actions Failure Test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup nanoFramework
        uses: CCSWE-nanoFramework/actions-nanoframework/.github/actions/setup-nanoframework@master

      - name: Build solution
        uses: CCSWE-nanoFramework/actions-nanoframework/.github/actions/build-nanoframework@master
        with:
          solution: solution/VsTestActionFailing.sln

      - name: Test Local Action
        id: test-action
        continue-on-error: true
        uses: ./
        with:
          working-directory: solution
          artifact-name: vstest-results-failure
          artifact-retention-days: 1

      - name: Check the action failed
        shell: bash
        env:
          OUTCOME: ${{ steps.test-action.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::Expected the action to fail, outcome was $OUTCOME"
            exit 1
          fi

  dependabot-merge:
    needs: [test-typescript, test-action, test-action-failure]
    if:
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          # Branch updates by the merge step re-sign commits; the job already requires a dependabot[bot] PR.
          skip-commit-verification: true

      - id: app-token
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}

      # Auto-merge waits for every required check; repos without branch protection can't use it, so merge directly.
      # A branch behind base (strict checks) is updated; the re-run CI comes back here.
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr merge "$PR_URL" --squash --auto || gh pr merge "$PR_URL" --squash
          if [ "$(gh pr view "$PR_URL" --json state,mergeStateStatus -q '.state + .mergeStateStatus')" = OPENBEHIND ]; then
            gh pr update-branch "$PR_URL"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  dependabot-update:
    if:
      github.event_name == 'push' && github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}

      # A sibling merge leaves auto-merge Dependabot PRs behind base; update them so CI re-runs and they merge.
      - run: |
          gh pr list -R "$REPO" --author app/dependabot --state open --json number,mergeStateStatus,autoMergeRequest \
            -q '.[] | select(.autoMergeRequest != null and .mergeStateStatus == "BEHIND") | .number' |
            while read -r n; do gh pr update-branch "$n" -R "$REPO"; done
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
