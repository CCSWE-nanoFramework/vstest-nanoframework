name: Continuous Integration

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Check Node Version Files
        id: node-version-files
        run: cmp .node-version .nvmrc

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup nanoFramework
        uses: ccswe-apps/actions/.github/actions/setup-nanoframework@nanoframework

      - name: Build solution
        uses: ccswe-apps/actions/.github/actions/build-nanoframework@nanoframework
        with:
          solution: solution/VsTestAction.sln

      # Defaults otherwise: NFUnitTest1 uses its own nano.runsettings and
      # NFUnitTest2 falls back to the package template, so two groups run.
      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          working-directory: solution
          artifact-name: vstest-results-default
          artifact-retention-days: 1

      - name: Check results
        shell: bash
        env:
          RESULTS: ${{ steps.test-action.outputs.results-directory }}
        run: |
          count="$(find "$RESULTS" -name '*.trx' | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::Expected 2 TRX files in $RESULTS, found $count"
            exit 1
          fi

  test-action-failure:
    name: GitHub Actions Failure Test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup nanoFramework
        uses: ccswe-apps/actions/.github/actions/setup-nanoframework@nanoframework

      - name: Build solution
        uses: ccswe-apps/actions/.github/actions/build-nanoframework@nanoframework
        with:
          solution: solution/VsTestActionFailing.sln

      - name: Test Local Action
        id: test-action
        continue-on-error: true
        uses: ./
        with:
          working-directory: solution
          artifact-name: vstest-results-failure
          artifact-retention-days: 1

      # The failure must come from the test run, so a TRX has to exist.
      - name: Check the action failed
        shell: bash
        env:
          OUTCOME: ${{ steps.test-action.outcome }}
          RESULTS: ${{ steps.test-action.outputs.results-directory }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::Expected the action to fail, outcome was $OUTCOME"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ -z "$(find "$RESULTS" -name '*.trx')" ]; then
            echo "::error::The action failed without writing test results"
            exit 1
          fi

  dependabot:
    needs: [test-typescript, test-action, test-action-failure]
    permissions:
      contents: read
      pull-requests: read
    uses: ccswe-apps/actions/.github/workflows/dependabot.yml@master
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
