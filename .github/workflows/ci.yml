name: Continuous Integration

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Check Node Version Files
        id: node-version-files
        run: cmp .node-version .nvmrc

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOLUTION_FOLDER: './solution/'
      SOLUTION: 'VsTestAction.sln'

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup nanoFramework
        uses: CCSWE-nanoFramework/actions-nanoframework/setup-nanoframework@master

      - name: Build solution
        uses: CCSWE-nanoFramework/actions-nanoframework/build-nanoframework@master
        with:
          solution: ${{ env.SOLUTION_FOLDER }}${{ env.SOLUTION }}

      # TEMPORARY diagnostic for issue #5 - do not merge.
      - name: Probe VS layout
        continue-on-error: true
        run: |
          Write-Host "=== VS install roots ==="
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          Write-Host "=== vstest.console.exe anywhere under Program Files ==="
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter vstest.console.exe -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          Write-Host "=== vswhere installationPath ==="
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -all -products * -property installationPath
          } else {
            Write-Host "vswhere.exe NOT FOUND at $vswhere"
          }
          Write-Host "=== exact path getVsTestPath globs ==="
          Test-Path "C:\Program Files\Microsoft Visual Studio\2022\*\Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          solutionFolder: ${{ env.SOLUTION_FOLDER }}
          runSettings: ${{ env.SOLUTION_FOLDER }}NFUnitTest1/nano.runsettings
          artifactName: 'non-default-artifact-name'
          artifactRetentionDays: 1
