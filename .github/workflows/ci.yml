name: Continuous Integration

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Check Node Version Files
        id: node-version-files
        run: cmp .node-version .nvmrc

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOLUTION_FOLDER: './solution/'
      SOLUTION: 'VsTestAction.sln'

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup nanoFramework
        uses: CCSWE-nanoFramework/actions-nanoframework/setup-nanoframework@master

      - name: Build solution
        uses: CCSWE-nanoFramework/actions-nanoframework/build-nanoframework@master
        with:
          solution: ${{ env.SOLUTION_FOLDER }}${{ env.SOLUTION }}

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          solutionFolder: ${{ env.SOLUTION_FOLDER }}
          runSettings: ${{ env.SOLUTION_FOLDER }}NFUnitTest1/nano.runsettings
          artifactName: 'non-default-artifact-name'
          artifactRetentionDays: 1

  dependabot-merge:
    needs: [test-typescript, test-action]
    if:
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          # Branch updates by the merge step re-sign commits; the job already requires a dependabot[bot] PR.
          skip-commit-verification: true

      - id: app-token
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}

      # Auto-merge waits for every required check; repos without branch protection can't use it, so merge directly.
      # A branch behind base (strict checks) is updated; the re-run CI comes back here.
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr merge "$PR_URL" --squash --auto || gh pr merge "$PR_URL" --squash
          if [ "$(gh pr view "$PR_URL" --json state,mergeStateStatus -q '.state + .mergeStateStatus')" = OPENBEHIND ]; then
            gh pr update-branch "$PR_URL"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
