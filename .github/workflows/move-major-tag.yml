name: Move major tag
run-name: Move ${{ inputs.major }} to ${{ inputs.target }}

# Points a major tag at another release by hand (e.g. a rollback). Releases move it
# automatically (release.yml).

on:
  workflow_dispatch:
    inputs:
      target:
        description: The tag or reference to use
        required: true
      major:
        type: choice
        description: The major version to update
        options:
          - v2
          - v1

permissions:
  contents: read

jobs:
  move:
    uses: ccswe-apps/actions/.github/workflows/move-major-tag.yml@master
    with:
      target: ${{ inputs.target }}
      major: ${{ inputs.major }}
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
