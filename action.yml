name: 'vstest-nanoframework'
description: 'Runs nanoFramework unit tests with VSTest and uploads the results'
author: 'CCSWE'

branding:
  icon: 'code'
  color: 'blue'

inputs:
  test-assemblies:
    description:
      'Glob patterns (one per line) for the test assemblies. Relative patterns
      are resolved against `working-directory`; `!` excludes.'
    required: false
    default: '**/bin/Release/NFUnitTest.dll'

  working-directory:
    description:
      'Directory that relative patterns and paths are resolved against'
    required: false
    default: '.'

  run-settings:
    description:
      'Run settings file to use for every test project. If not set, each project
      uses its own `nano.runsettings`, falling back to the template in its
      nanoFramework.TestFramework package.'
    required: false

  other-console-options:
    description:
      'Extra vstest.console.exe options, one per line, appended after the
      generated arguments'
    required: false

  results-directory:
    description:
      'Directory for the TRX results, cleared before the run. Defaults to
      `$RUNNER_TEMP/vstest-nanoframework`.'
    required: false

  if-no-tests-found:
    description:
      'What to do when no test assemblies match: `error`, `warn` or `ignore`'
    required: false
    default: 'error'

  artifact-name:
    description: 'Name of the results artifact. Empty skips the upload.'
    required: false
    default: 'vstest-results'

  artifact-retention-days:
    description:
      'Days to keep the results artifact (1-90). Empty or 0 uses the repository
      default.'
    required: false

outputs:
  results-directory:
    description: 'Directory containing the TRX results'
  artifact-id:
    description: 'ID of the uploaded results artifact'

runs:
  using: node24
  main: dist/index.js
